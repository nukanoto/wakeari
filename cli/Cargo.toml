[package]
name = "wakeari-cli"
version = "0.1.0"
edition = "2024"
description = "wakeari BLE バルブアラーム用のコマンドラインツール"

[[bin]]
name = "wakeari"
path = "src/main.rs"

[dependencies]
wakeari-protocol = { path = "../firmware/protocol" }
btleplug = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
uuid = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
